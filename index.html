<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Dev Adhoc → JIRA Bridge</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ===================================================================
     CONFIG — fill these in before you host/open this file.
     =================================================================== */
  :root {
    --bg: #12161d;
    --surface: #1a1f28;
    --surface-raised: #212733;
    --border: #2b3240;
    --text: #e7eaef;
    --text-muted: #8b94a3;
    --text-faint: #5b6472;
    --accent: #e8a33d;
    --accent-dim: rgba(232, 163, 61, 0.14);
    --todo: #7c8797;
    --todo-bg: rgba(124, 135, 151, 0.16);
    --progress: #e8a33d;
    --progress-bg: rgba(232, 163, 61, 0.16);
    --done: #4fb286;
    --done-bg: rgba(79, 178, 134, 0.16);
    --error: #d9636c;
    --error-bg: rgba(217, 99, 108, 0.14);
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
  }

  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }

  .title-block .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-faint);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .pulse-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--done);
    box-shadow: 0 0 0 0 rgba(79, 178, 134, 0.6);
    animation: pulse 2.4s infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .pulse-dot { animation: none; }
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(79, 178, 134, 0.5); }
    70%  { box-shadow: 0 0 0 6px rgba(79, 178, 134, 0); }
    100% { box-shadow: 0 0 0 0 rgba(79, 178, 134, 0); }
  }

  h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }

  h1 .arrow { color: var(--accent); margin: 0 8px; }

  .subtitle {
    color: var(--text-muted);
    font-size: 13.5px;
    margin-top: 6px;
    max-width: 520px;
  }

  button.refresh {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 16px;
    border-radius: var(--radius);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  button.refresh:hover { border-color: var(--accent); }
  button.refresh:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.refresh:disabled { opacity: 0.5; cursor: default; }

  .count-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 16px;
  }

  .board {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--surface);
  }

  .row {
    display: grid;
    grid-template-columns: auto 1fr auto auto auto;
    gap: 16px;
    align-items: center;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    animation: fadeIn 0.35s ease both;
  }

  @media (prefers-reduced-motion: reduce) { .row { animation: none; } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

  .row:last-child { border-bottom: none; }
  .row:hover { background: var(--surface-raised); }

  .ids {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .ids .yt { color: var(--text-muted); }
  .ids .arrow { color: var(--text-faint); }
  .ids a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--border); }
  .ids a:hover { border-color: var(--accent); color: var(--accent); }

  .summary {
    min-width: 0;
    font-size: 13.5px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .summary .yt-summary { color: var(--text-muted); }
  .summary .divider { color: var(--text-faint); margin: 0 6px; }

  .assignee {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
    display: none;
  }

  @media (min-width: 720px) { .assignee { display: block; } }

  .due {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .due.overdue { color: var(--error); }

  .age {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--text-faint);
    white-space: nowrap;
    display: none;
  }

  @media (min-width: 720px) { .age { display: block; } }

  .summary-board {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    padding: 16px 18px;
    margin-bottom: 28px;
  }

  .summary-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 10px;
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    font-size: 13.5px;
    border-bottom: 1px solid var(--border);
  }

  .summary-row:last-child { border-bottom: none; }

  .summary-count {
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-muted);
  }

  .status-section { margin-bottom: 28px; }

  .status-heading {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .status-heading.cat-todo { color: var(--todo); }
  .status-heading.cat-progress { color: var(--progress); }
  .status-heading.cat-done { color: var(--done); }
  .status-heading.cat-unknown { color: var(--text); }

  .status-total {
    color: var(--text-muted);
    font-weight: 400;
  }

  .status-breakdown {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .expand {
    display: none;
    padding: 0 18px 18px;
    border-bottom: 1px solid var(--border);
  }

  .expand.open { display: block; }
  .expand:last-child { border-bottom: none; }

  .expand textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    padding: 10px 12px;
    resize: vertical;
    min-height: 64px;
  }

  .expand textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .expand-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
  }

  .send-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    background: var(--accent);
    color: #1a1206;
    border: none;
    padding: 8px 16px;
    border-radius: var(--radius);
    cursor: pointer;
    font-weight: 600;
  }

  .send-btn:disabled { opacity: 0.5; cursor: default; }
  .send-btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  .status-msg { font-size: 12px; }
  .status-msg.ok { color: var(--done); }
  .status-msg.err { color: var(--error); }

  .empty, .error-state {
    padding: 48px 24px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13.5px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
  }

  .error-state {
    color: var(--error);
    background: var(--error-bg);
    border-color: var(--error-bg);
  }

  .error-state code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text);
  }

  footer {
    margin-top: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
    text-align: center;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title-block">
        <div class="eyebrow"><span class="pulse-dot"></span> live bridge</div>
        <h1>Dev Adhoc<span class="arrow">⟶</span>JIRA</h1>
        <div class="subtitle">Status for every YouTrack issue sitting in <strong>Dev Adhoc</strong>, pulled straight from its linked JIRA ticket. Comment here and it lands in JIRA — no JIRA seat required.</div>
      </div>
      <button class="refresh" id="refreshBtn" onclick="loadIssues()">↻ Refresh</button>
    </header>

    <div class="count-badge" id="countBadge"></div>
    <div id="board"><div class="empty">Loading…</div></div>
    <footer>reads YouTrack "Dev Adhoc" · writes to JIRA via /rest/api/2</footer>
  </div>

<script>
  // ---- CONFIG: point this at your deployed Edge Function -----------------
  const EDGE_FUNCTION_URL = "https://cbrfedvstfokrbcvxzbm.supabase.co/functions/v1/dev-adhoc-dashboard";
  const DASHBOARD_TOKEN = "a73a6059f0362f9715b97e208722fc3f"; // must match the Supabase secret
  // --------------------------------------------------------------------------

  let issues = [];
  let openKey = null;

  function categoryClass(colorName) {
    if (colorName === "green") return "cat-done";
    if (colorName === "yellow") return "cat-progress";
    if (colorName === "blue-gray") return "cat-todo";
    return "cat-unknown";
  }

  function categoryRank(colorName) {
    if (colorName === "blue-gray") return 0;
    if (colorName === "yellow") return 1;
    if (colorName === "green") return 2;
    return 3;
  }

  function escapeHtml(str) {
    return (str ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function formatDate(ms) {
    if (!ms) return null;
    return new Date(ms).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  function daysSince(ms) {
    if (!ms) return null;
    return Math.floor((Date.now() - ms) / 86400000);
  }

  function groupByProduct(list) {
    const counts = new Map();
    for (const issue of list) {
      const key = issue.product || "No Product";
      counts.set(key, (counts.get(key) || 0) + 1);
    }
    return [...counts.entries()].sort((a, b) => b[1] - a[1]);
  }

  function groupByStatus(list) {
    const groups = new Map();
    for (const issue of list) {
      const key = issue.jiraStatus || "Unknown";
      if (!groups.has(key)) groups.set(key, { statusCategory: issue.jiraStatusCategory, issues: [] });
      groups.get(key).issues.push(issue);
    }
    return [...groups.entries()].sort((a, b) => {
      const rankDiff = categoryRank(a[1].statusCategory) - categoryRank(b[1].statusCategory);
      return rankDiff !== 0 ? rankDiff : a[0].localeCompare(b[0]);
    });
  }

  function renderRow(issue, i) {
    const isOpen = openKey === issue.jiraKey;
    const dueMs = issue.adhocDueDateMs;
    const dueLabel = formatDate(dueMs);
    const isOverdue = !!dueMs && dueMs < Date.now() && issue.jiraStatusCategory !== "green";
    const ageDays = daysSince(issue.youtrackCreatedMs);

    return `
      <div class="row" style="animation-delay:${i * 25}ms" onclick="toggleExpand('${issue.jiraKey}')">
        <div class="ids">
          <a class="yt" href="${escapeHtml(issue.youtrackUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${escapeHtml(issue.youtrackId)}</a>
          <span class="arrow">⟶</span>
          <a href="${escapeHtml(issue.jiraUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${escapeHtml(issue.jiraKey)}</a>
        </div>
        <div class="summary">
          <span class="yt-summary">${escapeHtml(issue.youtrackSummary)}</span>
          <span class="divider">·</span>
          ${escapeHtml(issue.jiraSummary || "")}
        </div>
        <div class="assignee">${escapeHtml(issue.jiraAssignee || "Unassigned")}</div>
        <div class="due ${isOverdue ? "overdue" : ""}">${dueLabel ? `Due ${escapeHtml(dueLabel)}` : "No due date"}</div>
        <div class="age">${ageDays != null ? `${ageDays}d old` : ""}</div>
      </div>
      <div class="expand ${isOpen ? "open" : ""}" id="expand-${issue.jiraKey}">
        <textarea placeholder="Comment on ${escapeHtml(issue.jiraKey)}…" id="textarea-${issue.jiraKey}"></textarea>
        <div class="expand-actions">
          <button class="send-btn" onclick="event.stopPropagation(); sendComment('${issue.jiraKey}')" id="send-${issue.jiraKey}">Send to JIRA</button>
          <span class="status-msg" id="status-${issue.jiraKey}"></span>
        </div>
      </div>
    `;
  }

  function render() {
    const board = document.getElementById("board");
    const countBadge = document.getElementById("countBadge");

    if (issues.length === 0) {
      countBadge.textContent = "";
      board.innerHTML = '<div class="empty">No Dev Adhoc tickets with a linked JIRA issue right now.</div>';
      return;
    }

    countBadge.textContent = `${issues.length} ticket${issues.length === 1 ? "" : "s"} in Dev Adhoc`;

    const productTotals = groupByProduct(issues);
    const summaryHtml = `
      <div class="summary-board">
        <div class="summary-title">Totals by Product</div>
        ${productTotals.map(([product, count]) => `
          <div class="summary-row">
            <span class="summary-label">${escapeHtml(product)}</span>
            <span class="summary-count">${count}</span>
          </div>
        `).join("")}
      </div>
    `;

    const statusHtml = groupByStatus(issues).map(([status, group]) => {
      const breakdown = groupByProduct(group.issues);
      const rows = group.issues.map((issue, i) => renderRow(issue, i)).join("");
      return `
        <div class="status-section">
          <div class="status-heading ${categoryClass(group.statusCategory)}">
            <span>${escapeHtml(status)}</span>
            <span class="status-total">${group.issues.length}</span>
          </div>
          <div class="status-breakdown">${breakdown.map(([p, c]) => `${escapeHtml(p)}: ${c}`).join(" · ")}</div>
          <div class="board">${rows}</div>
        </div>
      `;
    }).join("");

    board.innerHTML = summaryHtml + statusHtml;
  }

  function toggleExpand(jiraKey) {
    openKey = openKey === jiraKey ? null : jiraKey;
    render();
  }

  async function loadIssues() {
    const board = document.getElementById("board");
    const refreshBtn = document.getElementById("refreshBtn");
    refreshBtn.disabled = true;
    refreshBtn.textContent = "↻ Refreshing…";
    board.innerHTML = '<div class="empty">Loading…</div>';

    try {
      const res = await fetch(`${EDGE_FUNCTION_URL}/list`, {
        headers: { "X-Dashboard-Token": DASHBOARD_TOKEN }
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
      issues = data.issues || [];
      render();
    } catch (err) {
      board.innerHTML = `<div class="error-state">Couldn't load tickets.<br><code>${escapeHtml(err.message)}</code><br>Check EDGE_FUNCTION_URL and DASHBOARD_TOKEN at the top of this file, and that the Edge Function is deployed.</div>`;
    } finally {
      refreshBtn.disabled = false;
      refreshBtn.textContent = "↻ Refresh";
    }
  }

  async function sendComment(jiraKey) {
    const textarea = document.getElementById(`textarea-${jiraKey}`);
    const sendBtn = document.getElementById(`send-${jiraKey}`);
    const statusEl = document.getElementById(`status-${jiraKey}`);
    const body = textarea.value.trim();

    if (!body) {
      statusEl.textContent = "Write something first.";
      statusEl.className = "status-msg err";
      return;
    }

    sendBtn.disabled = true;
    statusEl.textContent = "Sending…";
    statusEl.className = "status-msg";

    try {
      const res = await fetch(`${EDGE_FUNCTION_URL}/comment`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Dashboard-Token": DASHBOARD_TOKEN
        },
        body: JSON.stringify({ jiraKey, body })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
      statusEl.textContent = "Posted to JIRA ✓";
      statusEl.className = "status-msg ok";
      textarea.value = "";
    } catch (err) {
      statusEl.textContent = err.message;
      statusEl.className = "status-msg err";
    } finally {
      sendBtn.disabled = false;
    }
  }

  loadIssues();
</script>
</body>
</html>
