<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Dev Adhoc → JIRA Bridge</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ===================================================================
     CONFIG — fill these in before you host/open this file.
     =================================================================== */
  :root {
    --bg: #12161d;
    --surface: #1a1f28;
    --surface-raised: #212733;
    --border: #2b3240;
    --text: #e7eaef;
    --text-muted: #8b94a3;
    --text-faint: #5b6472;
    --accent: #e8a33d;
    --accent-dim: rgba(232, 163, 61, 0.14);
    --todo: #7c8797;
    --todo-bg: rgba(124, 135, 151, 0.16);
    --progress: #e8a33d;
    --progress-bg: rgba(232, 163, 61, 0.16);
    --done: #4fb286;
    --done-bg: rgba(79, 178, 134, 0.16);
    --error: #d9636c;
    --error-bg: rgba(217, 99, 108, 0.14);
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
  }

  .wrap {
    max-width: 1320px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }

  .title-block .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-faint);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .pulse-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--done);
    box-shadow: 0 0 0 0 rgba(79, 178, 134, 0.6);
    animation: pulse 2.4s infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .pulse-dot { animation: none; }
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(79, 178, 134, 0.5); }
    70%  { box-shadow: 0 0 0 6px rgba(79, 178, 134, 0); }
    100% { box-shadow: 0 0 0 0 rgba(79, 178, 134, 0); }
  }

  h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }

  h1 .arrow { color: var(--accent); margin: 0 8px; }

  .subtitle {
    color: var(--text-muted);
    font-size: 13.5px;
    margin-top: 6px;
    max-width: 520px;
  }

  button.refresh {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 16px;
    border-radius: var(--radius);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  button.refresh:hover { border-color: var(--accent); }
  button.refresh:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.refresh:disabled { opacity: 0.5; cursor: default; }

  .count-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 16px;
  }

  .row {
    display: grid;
    grid-template-columns: auto 1fr auto auto auto;
    gap: 16px;
    align-items: center;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    animation: fadeIn 0.35s ease both;
  }

  @media (prefers-reduced-motion: reduce) { .row { animation: none; } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

  .row:last-child { border-bottom: none; }
  .row:hover { background: var(--surface-raised); }

  .ids {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .ids .yt { color: var(--text-muted); }
  .ids .arrow { color: var(--text-faint); }
  .ids a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--border); }
  .ids a:hover { border-color: var(--accent); color: var(--accent); }

  .summary {
    min-width: 0;
    font-size: 13.5px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .summary .yt-summary { color: var(--text-muted); }
  .summary .divider { color: var(--text-faint); margin: 0 6px; }

  .assignee {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
    display: none;
  }

  .due {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .due.overdue { color: var(--error); }

  .age {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--text-faint);
    white-space: nowrap;
    display: none;
  }

  /* Cards now sit side by side, so column visibility responds to the card's
     own width (container query), not the viewport. */
  @container status-card (min-width: 460px) { .assignee { display: block; } }
  @container status-card (min-width: 560px) { .age { display: block; } }

  /* ---- Dashboard layout: product panel + status card grid, side by side ---- */

  .dashboard-grid {
    display: grid;
    grid-template-columns: minmax(260px, 320px) 1fr;
    gap: 20px;
    align-items: start;
  }

  @media (max-width: 860px) {
    .dashboard-grid { grid-template-columns: 1fr; }
  }

  .status-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 16px;
    align-items: start;
  }

  /* ---- Product panel: donut + legend, doubles as the product filter ---- */

  .product-panel {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    padding: 18px;
    position: sticky;
    top: 20px;
  }

  @media (max-width: 860px) {
    .product-panel { position: static; }
  }

  .panel-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 14px;
  }

  .donut-wrap {
    position: relative;
    width: 100%;
    max-width: 220px;
    margin: 0 auto 16px;
  }

  .donut-svg { display: block; width: 100%; height: auto; }
  .donut-svg circle { outline: none; }
  .donut-svg circle:focus-visible { opacity: 1; filter: brightness(1.2); }

  .donut-center-value {
    fill: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px;
    font-weight: 700;
  }

  .donut-center-caption {
    fill: var(--text-faint);
    font-family: 'Inter', sans-serif;
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .legend { display: flex; flex-direction: column; gap: 2px; }

  .legend-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 6px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12.5px;
    background: transparent;
    border: none;
    width: 100%;
    text-align: left;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    transition: background 0.12s ease, opacity 0.12s ease;
  }

  .legend-row:hover { background: var(--surface-raised); }
  .legend-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .legend-row.dimmed { opacity: 0.4; }
  .legend-row.active { background: var(--accent-dim); }

  .legend-swatch {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .legend-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .legend-count {
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-muted);
    font-size: 11.5px;
  }

  .clear-filter-btn {
    display: block;
    margin: 12px auto 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    background: none;
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 5px 12px;
    cursor: pointer;
  }

  .clear-filter-btn:hover { border-color: var(--accent); }
  .clear-filter-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .donut-tooltip {
    position: fixed;
    pointer-events: none;
    z-index: 20;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 12px;
    display: none;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
  }

  .donut-tooltip .tt-value {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    color: var(--text);
  }

  .donut-tooltip .tt-label { color: var(--text-muted); margin-top: 1px; }

  /* ---- Status cards ---- */

  .status-section {
    container: status-card / inline-size;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    padding: 16px 16px 4px;
  }

  .status-heading {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .status-heading.cat-todo { color: var(--todo); }
  .status-heading.cat-progress { color: var(--progress); }
  .status-heading.cat-done { color: var(--done); }
  .status-heading.cat-unknown { color: var(--text); }

  .status-total {
    color: var(--text-muted);
    font-weight: 400;
  }

  .status-breakdown {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 10px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .rows-list .row:last-child { border-bottom: none; }
  .rows-list .expand:last-child { border-bottom: none; }

  .expand {
    display: none;
    padding: 0 18px 18px;
    border-bottom: 1px solid var(--border);
  }

  .expand.open { display: block; }
  .expand:last-child { border-bottom: none; }

  .expand textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    padding: 10px 12px;
    resize: vertical;
    min-height: 64px;
  }

  .expand textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .expand-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
  }

  .send-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    background: var(--accent);
    color: #1a1206;
    border: none;
    padding: 8px 16px;
    border-radius: var(--radius);
    cursor: pointer;
    font-weight: 600;
  }

  .send-btn:disabled { opacity: 0.5; cursor: default; }
  .send-btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  .status-msg { font-size: 12px; }
  .status-msg.ok { color: var(--done); }
  .status-msg.err { color: var(--error); }

  .empty, .error-state {
    padding: 48px 24px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13.5px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
  }

  .error-state {
    color: var(--error);
    background: var(--error-bg);
    border-color: var(--error-bg);
  }

  .error-state code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text);
  }

  footer {
    margin-top: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
    text-align: center;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title-block">
        <div class="eyebrow"><span class="pulse-dot"></span> live bridge</div>
        <h1>Dev Adhoc<span class="arrow">⟶</span>JIRA</h1>
        <div class="subtitle">Status for every YouTrack issue sitting in <strong>Dev Adhoc</strong>, pulled straight from its linked JIRA ticket. Comment here and it lands in JIRA — no JIRA seat required.</div>
      </div>
      <button class="refresh" id="refreshBtn" onclick="loadIssues()">↻ Refresh</button>
    </header>

    <div class="count-badge" id="countBadge"></div>
    <div id="board"><div class="empty">Loading…</div></div>
    <div class="donut-tooltip" id="donutTooltip" role="status" aria-live="polite"></div>
    <footer>reads YouTrack "Dev Adhoc" · writes to JIRA via /rest/api/2</footer>
  </div>

<script>
  // ---- CONFIG: point this at your deployed Edge Function -----------------
  const EDGE_FUNCTION_URL = "https://cbrfedvstfokrbcvxzbm.supabase.co/functions/v1/dev-adhoc-dashboard";
  const DASHBOARD_TOKEN = "a73a6059f0362f9715b97e208722fc3f"; // must match the Supabase secret
  // --------------------------------------------------------------------------

  // Fixed-order categorical palette (dark-mode steps), validated with
  // scripts/validate_palette.js against this page's actual surface (#1a1f28):
  // all adjacent-pair CVD/contrast/lightness checks pass. Color is assigned
  // per product name (alphabetical slot), never by count-rank, so a product's
  // color doesn't shift when the filter changes which slices are dimmed.
  const CATEGORICAL = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"];
  const OTHER_COLOR = "#5b6472";
  const MAX_DONUT_SLICES = 6; // top 5 products + "Other" fold, per part-to-whole guidance

  let issues = [];
  let openKey = null;
  let activeProductFilter = null;

  function categoryClass(colorName) {
    if (colorName === "green") return "cat-done";
    if (colorName === "yellow") return "cat-progress";
    if (colorName === "blue-gray") return "cat-todo";
    return "cat-unknown";
  }

  function categoryRank(colorName) {
    if (colorName === "blue-gray") return 0;
    if (colorName === "yellow") return 1;
    if (colorName === "green") return 2;
    return 3;
  }

  function escapeHtml(str) {
    return (str ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function formatDate(ms) {
    if (!ms) return null;
    return new Date(ms).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  function daysSince(ms) {
    if (!ms) return null;
    return Math.floor((Date.now() - ms) / 86400000);
  }

  function groupByProduct(list) {
    const counts = new Map();
    for (const issue of list) {
      const key = issue.product || "No Product";
      counts.set(key, (counts.get(key) || 0) + 1);
    }
    return [...counts.entries()].sort((a, b) => b[1] - a[1]);
  }

  function groupByStatus(list) {
    const groups = new Map();
    for (const issue of list) {
      const key = issue.jiraStatus || "Unknown";
      if (!groups.has(key)) groups.set(key, { statusCategory: issue.jiraStatusCategory, issues: [] });
      groups.get(key).issues.push(issue);
    }
    return [...groups.entries()].sort((a, b) => {
      const rankDiff = categoryRank(a[1].statusCategory) - categoryRank(b[1].statusCategory);
      return rankDiff !== 0 ? rankDiff : a[0].localeCompare(b[0]);
    });
  }

  // Color slot is keyed to the product's name (alphabetical position among all
  // distinct products), not its rank by count — so a product keeps its color
  // across refreshes and filter toggles even if the ranking shifts.
  function productColor(name, allNamesSorted) {
    if (name === "Other") return OTHER_COLOR;
    const idx = allNamesSorted.indexOf(name);
    return CATEGORICAL[idx % CATEGORICAL.length];
  }

  function productDonutSlices(list) {
    const totals = groupByProduct(list); // desc by count
    const allNames = [...new Set(list.map((i) => i.product || "No Product"))].sort();
    if (totals.length <= MAX_DONUT_SLICES) {
      return totals.map(([name, count]) => ({ name, count, color: productColor(name, allNames) }));
    }
    const top = totals.slice(0, MAX_DONUT_SLICES - 1);
    const restCount = totals.slice(MAX_DONUT_SLICES - 1).reduce((sum, [, c]) => sum + c, 0);
    return [
      ...top.map(([name, count]) => ({ name, count, color: productColor(name, allNames) })),
      { name: "Other", count: restCount, color: OTHER_COLOR },
    ];
  }

  function filteredIssues() {
    if (!activeProductFilter) return issues;
    return issues.filter((i) => (i.product || "No Product") === activeProductFilter);
  }

  function toggleProductFilter(name) {
    activeProductFilter = activeProductFilter === name ? null : name;
    render();
  }

  function renderDonut(slices, total) {
    const cx = 100, cy = 100, r = 70, sw = 28, GAP = 3;
    const C = 2 * Math.PI * r;
    let cum = 0;

    const circles = slices.map((s) => {
      const frac = total > 0 ? s.count / total : 0;
      const len = Math.max(frac * C - GAP, 0);
      const offset = -cum - GAP / 2;
      cum += frac * C;
      const isActive = activeProductFilter === s.name;
      const isDimmed = !!activeProductFilter && !isActive;
      return `<circle
        cx="${cx}" cy="${cy}" r="${r}" fill="none"
        stroke="${s.color}" stroke-width="${isActive ? sw + 6 : sw}" stroke-linecap="butt"
        stroke-dasharray="${len} ${Math.max(C - len, 0)}" stroke-dashoffset="${offset}"
        opacity="${isDimmed ? 0.28 : 1}"
        style="cursor:pointer; transition: stroke-width .15s ease, opacity .15s ease;"
        data-product="${escapeHtml(s.name)}" data-count="${s.count}"
        tabindex="0" role="button" aria-pressed="${isActive}"
        aria-label="${escapeHtml(s.name)}: ${s.count} ticket${s.count === 1 ? "" : "s"}"
      ></circle>`;
    }).join("");

    const centerValue = activeProductFilter
      ? (slices.find((s) => s.name === activeProductFilter)?.count ?? 0)
      : total;
    const centerCaption = activeProductFilter
      ? activeProductFilter
      : `ticket${total === 1 ? "" : "s"}`;

    return `
      <div class="donut-wrap">
        <svg viewBox="0 0 200 200" class="donut-svg" role="img" aria-label="Tickets by product">
          <g transform="rotate(-90 ${cx} ${cy})">${circles}</g>
          <text x="${cx}" y="${cy - 4}" text-anchor="middle" class="donut-center-value">${centerValue}</text>
          <text x="${cx}" y="${cy + 18}" text-anchor="middle" class="donut-center-caption">${escapeHtml(String(centerCaption)).slice(0, 24)}</text>
        </svg>
      </div>
    `;
  }

  function renderLegend(slices) {
    return `
      <div class="legend">
        ${slices.map((s) => {
          const isActive = activeProductFilter === s.name;
          const isDimmed = !!activeProductFilter && !isActive;
          return `
            <button type="button" class="legend-row ${isActive ? "active" : ""} ${isDimmed ? "dimmed" : ""}"
              data-product="${escapeHtml(s.name)}" data-count="${s.count}" aria-pressed="${isActive}">
              <span class="legend-swatch" style="background:${s.color}"></span>
              <span class="legend-name">${escapeHtml(s.name)}</span>
              <span class="legend-count">${s.count}</span>
            </button>
          `;
        }).join("")}
      </div>
      ${activeProductFilter ? `<button type="button" class="clear-filter-btn" id="clearFilterBtn">✕ Clear filter</button>` : ""}
    `;
  }

  function showDonutTooltip(evt, name, count, total) {
    const tt = document.getElementById("donutTooltip");
    const pct = total > 0 ? Math.round((count / total) * 100) : 0;
    tt.innerHTML = "";
    const valueEl = document.createElement("div");
    valueEl.className = "tt-value";
    valueEl.textContent = `${count} ticket${count === 1 ? "" : "s"} · ${pct}%`;
    const labelEl = document.createElement("div");
    labelEl.className = "tt-label";
    labelEl.textContent = name;
    tt.appendChild(valueEl);
    tt.appendChild(labelEl);
    tt.style.display = "block";
    const pad = 14;
    tt.style.left = `${evt.clientX + pad}px`;
    tt.style.top = `${evt.clientY + pad}px`;
  }

  function hideDonutTooltip() {
    document.getElementById("donutTooltip").style.display = "none";
  }

  function attachProductPanelHandlers(slices, total) {
    const panel = document.getElementById("productPanel");
    if (!panel) return;

    const handleActivate = (name) => toggleProductFilter(name);

    panel.querySelectorAll("[data-product]").forEach((el) => {
      const name = el.dataset.product;
      const count = Number(el.dataset.count);
      el.addEventListener("click", () => handleActivate(name));
      el.addEventListener("keydown", (evt) => {
        if (evt.key === "Enter" || evt.key === " ") {
          evt.preventDefault();
          handleActivate(name);
        }
      });
      el.addEventListener("pointermove", (evt) => showDonutTooltip(evt, name, count, total));
      el.addEventListener("pointerleave", hideDonutTooltip);
      el.addEventListener("focus", (evt) => showDonutTooltip(evt, name, count, total));
      el.addEventListener("blur", hideDonutTooltip);
    });

    const clearBtn = document.getElementById("clearFilterBtn");
    if (clearBtn) clearBtn.addEventListener("click", () => { activeProductFilter = null; render(); });
  }

  function renderRow(issue, i) {
    const isOpen = openKey === issue.jiraKey;
    const dueMs = issue.adhocDueDateMs;
    const dueLabel = formatDate(dueMs);
    const isOverdue = !!dueMs && dueMs < Date.now() && issue.jiraStatusCategory !== "green";
    const ageDays = daysSince(issue.youtrackCreatedMs);

    return `
      <div class="row" style="animation-delay:${i * 25}ms" onclick="toggleExpand('${issue.jiraKey}')">
        <div class="ids">
          <a class="yt" href="${escapeHtml(issue.youtrackUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${escapeHtml(issue.youtrackId)}</a>
          <span class="arrow">⟶</span>
          <a href="${escapeHtml(issue.jiraUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${escapeHtml(issue.jiraKey)}</a>
        </div>
        <div class="summary">
          <span class="yt-summary">${escapeHtml(issue.youtrackSummary)}</span>
          <span class="divider">·</span>
          ${escapeHtml(issue.jiraSummary || "")}
        </div>
        <div class="assignee">${escapeHtml(issue.jiraAssignee || "Unassigned")}</div>
        <div class="due ${isOverdue ? "overdue" : ""}">${dueLabel ? `Due ${escapeHtml(dueLabel)}` : "No due date"}</div>
        <div class="age">${ageDays != null ? `${ageDays}d old` : ""}</div>
      </div>
      <div class="expand ${isOpen ? "open" : ""}" id="expand-${issue.jiraKey}">
        <textarea placeholder="Comment on ${escapeHtml(issue.jiraKey)}…" id="textarea-${issue.jiraKey}"></textarea>
        <div class="expand-actions">
          <button class="send-btn" onclick="event.stopPropagation(); sendComment('${issue.jiraKey}')" id="send-${issue.jiraKey}">Send to JIRA</button>
          <span class="status-msg" id="status-${issue.jiraKey}"></span>
        </div>
      </div>
    `;
  }

  function render() {
    const board = document.getElementById("board");
    const countBadge = document.getElementById("countBadge");

    if (issues.length === 0) {
      countBadge.textContent = "";
      board.innerHTML = '<div class="empty">No Dev Adhoc tickets with a linked JIRA issue right now.</div>';
      return;
    }

    // If the active filter no longer matches anything (e.g. after a refresh
    // where that product has no Dev Adhoc tickets left), drop it rather than
    // show an empty dashboard.
    if (activeProductFilter && !issues.some((i) => (i.product || "No Product") === activeProductFilter)) {
      activeProductFilter = null;
    }

    const scoped = filteredIssues();
    const filterSuffix = activeProductFilter ? ` · filtered to ${activeProductFilter}` : "";
    countBadge.textContent = `${scoped.length} of ${issues.length} ticket${issues.length === 1 ? "" : "s"} in Dev Adhoc${filterSuffix}`;

    // The donut always reflects totals across ALL products — it's the filter
    // control, not something the filter itself scopes.
    const slices = productDonutSlices(issues);
    const donutTotal = issues.length;

    const productPanelHtml = `
      <div class="product-panel" id="productPanel">
        <div class="panel-title">Tickets by Product</div>
        ${renderDonut(slices, donutTotal)}
        ${renderLegend(slices)}
      </div>
    `;

    const statusGridHtml = `
      <div class="status-grid">
        ${groupByStatus(scoped).map(([status, group]) => {
          const breakdown = groupByProduct(group.issues);
          const rows = group.issues.map((issue, i) => renderRow(issue, i)).join("");
          return `
            <div class="status-section">
              <div class="status-heading ${categoryClass(group.statusCategory)}">
                <span>${escapeHtml(status)}</span>
                <span class="status-total">${group.issues.length}</span>
              </div>
              <div class="status-breakdown">${breakdown.map(([p, c]) => `${escapeHtml(p)}: ${c}`).join(" · ")}</div>
              <div class="rows-list">${rows}</div>
            </div>
          `;
        }).join("")}
      </div>
    `;

    board.innerHTML = `
      <div class="dashboard-grid">
        ${productPanelHtml}
        ${statusGridHtml}
      </div>
    `;

    attachProductPanelHandlers(slices, donutTotal);
  }

  function toggleExpand(jiraKey) {
    openKey = openKey === jiraKey ? null : jiraKey;
    render();
  }

  async function loadIssues() {
    const board = document.getElementById("board");
    const refreshBtn = document.getElementById("refreshBtn");
    refreshBtn.disabled = true;
    refreshBtn.textContent = "↻ Refreshing…";
    board.innerHTML = '<div class="empty">Loading…</div>';

    try {
      const res = await fetch(`${EDGE_FUNCTION_URL}/list`, {
        headers: { "X-Dashboard-Token": DASHBOARD_TOKEN }
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
      issues = data.issues || [];
      render();
    } catch (err) {
      board.innerHTML = `<div class="error-state">Couldn't load tickets.<br><code>${escapeHtml(err.message)}</code><br>Check EDGE_FUNCTION_URL and DASHBOARD_TOKEN at the top of this file, and that the Edge Function is deployed.</div>`;
    } finally {
      refreshBtn.disabled = false;
      refreshBtn.textContent = "↻ Refresh";
    }
  }

  async function sendComment(jiraKey) {
    const textarea = document.getElementById(`textarea-${jiraKey}`);
    const sendBtn = document.getElementById(`send-${jiraKey}`);
    const statusEl = document.getElementById(`status-${jiraKey}`);
    const body = textarea.value.trim();

    if (!body) {
      statusEl.textContent = "Write something first.";
      statusEl.className = "status-msg err";
      return;
    }

    sendBtn.disabled = true;
    statusEl.textContent = "Sending…";
    statusEl.className = "status-msg";

    try {
      const res = await fetch(`${EDGE_FUNCTION_URL}/comment`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Dashboard-Token": DASHBOARD_TOKEN
        },
        body: JSON.stringify({ jiraKey, body })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
      statusEl.textContent = "Posted to JIRA ✓";
      statusEl.className = "status-msg ok";
      textarea.value = "";
    } catch (err) {
      statusEl.textContent = err.message;
      statusEl.className = "status-msg err";
    } finally {
      sendBtn.disabled = false;
    }
  }

  loadIssues();
</script>
</body>
</html>
